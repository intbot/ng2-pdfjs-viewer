name: IndexNow

# When Vercel reports a successful production deploy of the docs site, send its sitemap to IndexNow
# (scripts/indexnow.mjs) so Bing and the other IndexNow engines recrawl the changed pages.
on:
  deployment_status:
  workflow_dispatch:

permissions: read-all

jobs:
  ping:
    name: Ping IndexNow
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production – angular-pdf-viewer-docs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.x'
      - run: node scripts/indexnow.mjs

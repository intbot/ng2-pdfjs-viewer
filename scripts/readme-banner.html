<!doctype html>
<!-- README banner (lib/pdf-viewer-banner.png). scripts/downloads-milestone.mjs keeps the numbers
     current and re-renders the PNG with headless Chrome at 2x (2080x500). -->
<html><head><meta charset="utf-8"><style>
  body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  .ban{width:1040px;height:250px;background:#fff;border-radius:16px;box-sizing:border-box;overflow:hidden;
       padding:28px 40px;display:flex;flex-direction:column;justify-content:center;gap:20px}
  .hd{font-weight:820;letter-spacing:-.4px;color:#15181f}
  .brk{color:#6b7280;font-size:13px;margin-top:4px}
  .gv{font-weight:850;color:#15181f;letter-spacing:-1px;line-height:1}
  .gl{color:#6b7280;font-size:12px;margin-top:5px}
  .sep{width:1px;height:48px;background:#e9ecf2}
  .angtext{background:linear-gradient(120deg,#E40035,#9717E7);-webkit-background-clip:text;background-clip:text;color:transparent}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  .chip{display:inline-block;border-radius:9px;padding:10px 16px;font-size:14px;background:#f7f5ff;border:1px solid #e7deff}
  .chip .p{color:#b6a3e0}.chip .cmd{color:#6b7280}.chip .pkg{color:#6C00F5;font-weight:700}
</style></head>
<body>
<div class="ban">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:16px">
      <svg width="64" height="64" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="g" x1="0" y1="0" x2=".55" y2="1">
          <stop offset="0" stop-color="#E40035"/><stop offset=".24" stop-color="#F60A48"/>
          <stop offset=".352" stop-color="#F20755"/><stop offset=".494" stop-color="#DC087D"/>
          <stop offset=".745" stop-color="#9717E7"/><stop offset="1" stop-color="#6C00F5"/>
        </linearGradient></defs>
        <path d="M28 12 H56 L74 30 V80 A4 4 0 0 1 70 84 H28 A4 4 0 0 1 24 80 V16 A4 4 0 0 1 28 12 Z" fill="url(#g)"/>
        <path d="M56 12 V26 A4 4 0 0 0 60 30 H74 Z" fill="#fff" fill-opacity=".4"/>
        <path d="M40 12 H50 V34 L45 29 L40 34 Z" fill="#fff" fill-opacity=".9"/>
        <text x="49" y="73" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="17" fill="#fff" letter-spacing="-.5">PDF</text>
      </svg>
      <div>
        <div class="hd" style="font-size:25px"><span class="angtext">#1</span> Angular PDF Viewer</div>
        <div class="brk">AI-enabled, feature-rich and comprehensive</div>
      </div>
    </div>
    <span class="chip mono"><span class="p">$</span> <span class="cmd">npm i</span> <span class="pkg">ng2-pdfjs-viewer</span></span>
  </div>
  <div style="border-top:1px solid #eef0f4;padding-top:18px;display:flex;align-items:center;justify-content:space-around">
    <div style="text-align:center"><div class="gv" style="font-size:46px">9M+</div><div class="gl">downloads</div></div>
    <div class="sep"></div>
    <div style="text-align:center"><div class="gv" style="font-size:46px">0</div><div class="gl">runtime deps</div></div>
    <div class="sep"></div>
    <div style="text-align:center"><div class="gv" style="font-size:46px">8 yrs</div><div class="gl">since 2018</div></div>
    <div class="sep"></div>
    <div style="text-align:center"><div class="gv" style="font-size:46px">10 → 22</div><div class="gl">Angular versions</div></div>
  </div>
</div>
</body></html>
